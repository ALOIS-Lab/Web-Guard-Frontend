<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGuard — Monitor. Protect. Assure.</title>
    <meta name="description" content="WebGuard is an AI-powered website availability, performance, and security monitoring application. Monitor your sites 24/7 with instant alerts and detailed scan reports." />
    <meta property="og:title" content="WebGuard — Monitor. Protect. Assure." />
    <meta property="og:description" content="AI-powered website availability, performance, and security monitoring." />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('webguard_theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
